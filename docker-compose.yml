        "0.0.0.0",
        "--port",
        "9100",
        "--cache-dir",
        "/data/edge_cache_edgedis",
        "--coordinator-id",
        "e0",
        "--peers",
        "e0@edgedis0:9100,e1@edgedis1:9100,e3@edgedis3:9100",
      ]
    volumes:
      - ./experiments/data:/app/experiments/data
      - ./metrics:/metrics
