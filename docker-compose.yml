        "edge.edgedis_node",
        "--id",
        "e0",
        "--host",
        "0.0.0.0",
        "--port",
        "9100",
        "--cache-dir",
        "/data/edge_cache_edgedis",
        "--coordinator-id",
        "e0",
        "--peers",
        "e1@edgedis1:9100,e2@edgedis2:9100,e3@edgedis3:9100",
